name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.target }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-x64
          - linux-arm64
          - macos-x64
          - macos-arm64
          - windows-x64
        node:
          - 22
          - 24
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-x64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-14
          - target: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run smoke:npm

  differential:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.2
          cache: true
      - run: npm ci
      - run: npm run test:differential

  installed-user-journey:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  skills:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: genauth-agent-cli
      - uses: actions/checkout@v4
        with:
          repository: Authing/genauth-agent-skill
          path: genauth-agent-skill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: genauth-agent-cli/package-lock.json
      - run: npm ci
        working-directory: genauth-agent-cli
      - run: npm run build && npm run contract:export && npm run skills:verify -- ../genauth-agent-skill
        working-directory: genauth-agent-cli
