name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  platform-verify:
    name: ${{ matrix.target }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-x64
          - linux-arm64
          - macos-x64
          - macos-arm64
          - windows-x64
        node:
          - 22
          - 24
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-x64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-14
          - target: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run smoke:npm

  differential:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.2
          cache: true
      - run: npm ci
      - run: npm run test:differential

  installed-user-journey:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  keychain-compatibility:
    name: Keychain compatibility / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: macos-arm64
            os: macos-14
          - target: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.2
          cache: true
      - run: npm ci
      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends dbus-x11 gnome-keyring
      - name: Verify Linux Go/Node Keychain compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: dbus-run-session -- ./scripts/run-linux-keychain-compat.sh
      - name: Verify native Go/Node Keychain compatibility
        if: runner.os != 'Linux'
        run: npm run test:keychain-compat

  skills:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: genauth-agent-cli
      - uses: actions/checkout@v4
        with:
          repository: Authing/genauth-agent-skill
          path: genauth-agent-skill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: genauth-agent-cli/package-lock.json
      - run: npm ci
        working-directory: genauth-agent-cli
      - run: npm run build && npm run contract:export && npm run skills:verify -- ../genauth-agent-skill
        working-directory: genauth-agent-cli

  release:
    needs:
      - platform-verify
      - differential
      - installed-user-journey
      - keychain-compatibility
      - skills
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify tag version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
      - run: npm ci
      - run: npm run build && npm run contract:export && npm run metadata:check
      - run: ./scripts/package-github-release.sh
      - name: Publish npm package
        run: ./scripts/publish-npm.sh "${GITHUB_REF_NAME#v}" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
