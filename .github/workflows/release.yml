name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify tag version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
      - run: npm ci
      - run: npm run verify
      - run: npm run smoke:npm
      - run: ./scripts/package-github-release.sh
      - name: Publish npm package
        run: ./scripts/publish-npm.sh "${GITHUB_REF_NAME#v}" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
